name: Daily Obtainium Emulation Pack Check

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

jobs:
  update-pack:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download latest Obtainium Emulation Pack JSON
        env:
          API_URL: https://api.github.com/repos/RJNY/Obtainium-Emulation-Pack/releases/latest
          TARGET_DIR: GAMES/support_files/obtainium
        run: |
          set -euo pipefail

          mkdir -p "$TARGET_DIR"
          TEMP_PATH="$(mktemp "$TARGET_DIR/.obtainium-emulation-pack.XXXXXX.json")"
          trap 'rm -f "$TEMP_PATH"' EXIT

          RELEASE_JSON="$(curl -fsSL "$API_URL")"

          PACK_ASSETS="$(printf '%s' "$RELEASE_JSON" | jq -c '[.assets[] | select(.name | test("^obtainium-emulation-pack-v[^/]+\\.json$"))]')"
          PACK_COUNT="$(printf '%s' "$PACK_ASSETS" | jq 'length')"

          if [ "$PACK_COUNT" -ne 1 ]; then
            echo "Error: Expected exactly one standard Obtainium Emulation Pack JSON asset, found $PACK_COUNT"
            exit 1
          fi

          PACK_NAME="$(printf '%s' "$PACK_ASSETS" | jq -r '.[0].name')"
          PACK_URL="$(printf '%s' "$PACK_ASSETS" | jq -r '.[0].browser_download_url')"

          if [ -z "$PACK_NAME" ] || [ "$PACK_NAME" = "null" ] || [ -z "$PACK_URL" ] || [ "$PACK_URL" = "null" ]; then
            echo "Error: The standard Obtainium Emulation Pack asset is missing a name or download URL"
            exit 1
          fi

          echo "Downloading $PACK_NAME"
          if ! curl --fail --location --silent --show-error -o "$TEMP_PATH" "$PACK_URL"; then
            echo "Error: Failed to download $PACK_NAME"
            exit 1
          fi

          find "$TARGET_DIR" -maxdepth 1 -type f \
            \( -name 'obtainium-emulation-pack-v*.json' -o -name 'obtainium-emulation-pack-dual-screen-*.json' \) \
            -delete
          mv "$TEMP_PATH" "$TARGET_DIR/$PACK_NAME"
          trap - EXIT

      - name: Check for file changes
        run: |
          if [ -n "$(git status --porcelain -- GAMES/support_files/obtainium)" ]; then
            echo "New Obtainium Emulation Pack version detected. Committing changes..."
            echo "changed=true" >> "$GITHUB_ENV"
          else
            echo "No changes detected. Obtainium Emulation Pack JSON files are already up to date."
            echo "changed=false" >> "$GITHUB_ENV"
          fi

      - name: Commit and push updated JSON files
        if: env.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions@github.com'
          git add -A -- \
            'GAMES/support_files/obtainium/obtainium-emulation-pack-v*.json' \
            'GAMES/support_files/obtainium/obtainium-emulation-pack-dual-screen-*.json'
          git commit -m "chore(auto-update): Update Obtainium Emulation Pack JSON files"
          git push origin "HEAD:${DEFAULT_BRANCH}"
